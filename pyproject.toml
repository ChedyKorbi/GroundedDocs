[project]
name = "groundeddocs"
version = "0.1.0"
description = "Production-grade hybrid RAG system with Arabic support (Arabic pass deferred to v1.1)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Chedy Korbi" }]
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<0.1",
    "langchain>=1.3,<2.0",
    "langchain-core>=1.5,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langchain-qdrant>=1.1,<2.0",
    "qdrant-client>=1.19,<2.0",
    "groq>=1.6,<2.0",
    "rank-bm25>=0.2,<0.3",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=5.6,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "pre-commit>=4.0,<5.0",
    "pip-audit>=2.10,<2.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
