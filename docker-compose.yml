services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - GROUNDEDDOCS_QDRANT_URL=http://qdrant:6333
      - GROUNDEDDOCS_SEED_ON_BOOT=true
      - HF_HOME=/cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; b=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if b.get('status')=='ok' else 1)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 600s

volumes:
  qdrant_data:
  hf_cache:
